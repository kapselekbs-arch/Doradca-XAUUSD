name: doradca
on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
    inputs:
      komenda:
        description: "Polecenie, np. /karta lub /wykres 15"
        required: false
        default: ""
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'komenda' || 'doradca' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: stan-${{ github.run_id }}
          restore-keys: |
            stan-
      - run: python live.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOMENDA: ${{ github.event.inputs.komenda }}
          TRYB_WEBHOOK: "1"
